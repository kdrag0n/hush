[workspace]
members = ["hush-core", "hush", "hush-server"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://example.invalid/hush"

[workspace.dependencies]
anyhow = "1.0.100"
astral-tokio-tar = "0.7.0"
async-compression = { version = "0.4.42", features = ["tokio", "zstd"] }
aws-lc-rs = "1.15.1"
base64 = "0.23.1"
usage-rs = "7.0.0"
hex = "0.4.3"
futures-core = "0.3.32"
libc = "0.2.177"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
quinn = { version = "0.11.9", default-features = false, features = [
    "bloom",
    "log",
    "platform-verifier",
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
quinn-udp = { version = "0.5.14", features = ["fast-apple-datapath"] }
quinn-proto = { version = "0.11.14", default-features = false, features = [
    "bloom",
    "log",
    "platform-verifier",
    "rustls-aws-lc-rs",
] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13.1", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p521 = { version = "0.13.3", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
rcgen = { version = "0.14.7", default-features = false, features = ["aws_lc_rs", "pem"] }
rpassword = "7.4.0"
rustls = { version = "0.23.45", features = ["aws-lc-rs"] }
rustls-pki-types = "1.13.2"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
socket2 = "0.6.3"
shell-words = "1.1.0"
ssh-key = { version = "0.6.7", default-features = false, features = [
    "ecdsa",
    "ed25519",
    "encryption",
    "p256",
    "p384",
    "p521",
    "std",
] }
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
x509-parser = "0.18.0"
xdg = "3.0.0"

[patch.crates-io]
quinn = { path = "vendor/quinn" }
quinn-proto = { path = "vendor/quinn-proto" }
quinn-udp = { path = "vendor/quinn-udp" }
